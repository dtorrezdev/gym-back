local.TestOnBorrow=true
local.TestOnReturn=false
local.TestWhileIdle=false
local.TimeBetweenEvictionRunsMillis=30000
local.ValidationInterval=30000
local.ValidationQuery=SELECT 1 FROM DUAL
local.JdbcInterceptors=org.apache.tomcat.jdbc.pool.interceptor.ConnectionState;org.apache.tomcat.jdbc.pool.interceptor.StatementFinalizer;org.apache.tomcat.jdbc.pool.interceptor.ResetAbandonedTimer
