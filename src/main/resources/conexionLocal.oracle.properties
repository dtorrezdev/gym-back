local.Url=jdbc:oracle:thin:@ol8-19.localdomain:1521:orcl
#local.Url=jdbc:oracle:thin:@micrium2:1521:orcl
local.user=MOD_BASE
local.password=MOD_BASE

local.DriverClassName=oracle.jdbc.OracleDriver
local.JmxEnabled=true
local.LogAbandoned=true
local.MaxActive=10
local.MaxWait=30000
local.MaxIdle=3
local.MinIdle=1
local.MinEvictableIdleTimeMillis=60000
local.RemoveAbandoned=false
